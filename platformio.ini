; Seeed XIAO ESP32-C3 — RL90 Lamp Controller (PopBloom RL90)

; default_envs: bez tego `pio run`/`pio run -t upload` bez `-e` operowałoby na
; WSZYSTKICH environmentach poniżej (także espota). USB zostaje domyślny — OTA
; wymaga jawnego `-e seeed_xiao_esp32c3_ota`.
[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; Dwa sloty OTA (app0/app1) po 1,875 MB na 4 MB flash — wzorzec z dolewki na C3
; (top_off_water_new-iot/docs/OTA_FEASIBILITY_ESP32C3.md). huge_app.csv ma jeden
; slot i OTA kończy się abort() w esp_flash_erase_region; default.csv (2×1,25 MB)
; jest za ciasny. Pusty spiffs 128 KB nieużywany (dane w FRAM I2C).
board_build.partitions = min_spiffs.csv

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Upload & Monitor
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Isrc/config
    -Isrc/hardware
    -Isrc/lamp
    -Isrc/web
    -Isrc/core
    -Isrc/network
    -Isrc/security
    -Isrc/crypto
    -Isrc/provisioning

; Hasło OTA: scripts/ota_secret.py czyta zmienną o tej nazwie (wspólny ~/.secrets/iot.env,
; nazwa po IP urządzenia) i daje nagłówek ota_secret.h + --auth dla espota. NIE przez
; ${sysenv...}: wartość zmiennej wchodzi wtedy do project.checksum i każda różnica
; (shell bez iot.env) kasuje cały .pio/build — pełna kompilacja obu środowisk.
; Env _ota bierze nazwę zmiennej z IP docelowego (--upload-port 192.168.10.6 →
; OTA_PASSWORD_192_168_10_6); ta poniżej dotyczy buildu USB i domyślnego upload_port.
custom_ota_password_var = OTA_PASSWORD_192_168_10_5
extra_scripts = pre:scripts/ota_secret.py

lib_deps =
    Wire
    mathieucarbou/AsyncTCP@^3.2.14
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    bblanchon/ArduinoJson@^7.4.2
    adafruit/RTClib@^2.1.1
    adafruit/Adafruit FRAM I2C

; Upload przez WiFi (ArduinoOTA). Ten sam firmware, inny sposób wgrywania.
; Wymaga zmiennej z custom_ota_password_var w env shella (~/.secrets/iot.env) —
; --auth dokłada scripts/ota_secret.py. Pierwszy upload z kodem OTA — przez USB.
[env:seeed_xiao_esp32c3_ota]
extends = env:seeed_xiao_esp32c3
upload_protocol = espota
upload_port = 192.168.10.5
; host_port stały — komp i lampa w różnych podsieciach (VLAN IoT), zwrotne
; połączenie espota wymaga reguły firewalla na Mikrotiku zawężonej do tego portu.
upload_flags =
    --host_port=8266
