
; Seeed XIAO ESP32-C3 — Thermo Control System

; default_envs: bez tego `pio run`/`pio run -t upload` bez `-e` operowałoby na
; WSZYSTKICH environmentach poniżej (czyli po dodaniu _ota próbowałoby też
; espota-upload przy zwykłym USB uploadzie). USB zostaje domyślny — OTA wymaga
; jawnego `-e seeed_xiao_esp32s3_ota`.
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Partition scheme — dwa sloty OTA (app0/app1) po 3MB, dopasowane do realnego
; 16MB flash (Waveshare ESP32-S3-Pico). Wcześniej huge_app.csv miał tylko JEDEN
; slot (app0) — OTA nadpisywało samo siebie (self-overwrite), co okazało się
; powodować abort() w esp_flash_erase_region przy kasowaniu sektora (patrz
; docs/DEV_UPLOAD_LOGGING_CLI_ARCHITECTURE.md). Rozmiar app0/app1 taki sam jak
; poprzedni pojedynczy slot (0x300000=3MB) — bez straty miejsca na firmware.
; Partycja "ffat" (FAT) nieużywana w tym projekcie (dane w zewnętrznym FRAM SPI).
board_build.partitions = app3M_fat9M_16MB.csv

; Flash settings
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; Upload & Monitor
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DOTA_PASSWORD=\"${sysenv.OTA_PASSWORD_192_168_10_4}\"
    -Isrc/config
    -Isrc/hardware
    -Isrc/algorithm
    -Isrc/web
    -Isrc/core
    -Isrc/network
    -Isrc/security
    -Isrc/crypto
    -Isrc/provisioning

lib_deps =
    Wire
    mathieucarbou/AsyncTCP@^3.2.14
    mathieucarbou/ESPAsyncWebServer@^3.3.23
    bblanchon/ArduinoJson@^7.4.2
    adafruit/RTClib@^2.1.1
    adafruit/Adafruit FRAM SPI

; Upload przez WiFi (ArduinoOTA) — zamiennik kabla USB na czas developmentu.
; Ten sam firmware co [env:seeed_xiao_esp32s3] (OTA_PASSWORD wspólny przez
; extends), zmienia się tylko sposób wgrywania. Wymaga zmiennej środowiskowej
; OTA_PASSWORD_192_168_10_4 ustawionej przed `pio run` — nazwa po lokalnym IP
; urządzenia, nie po nazwie projektu, żeby uniknąć kolizji z innymi projektami
; IoT dzielącymi ten sam ~/.secrets/iot.env (patrz docs/OTA_WIFI_UPLOAD_PATTERN.md).
[env:seeed_xiao_esp32s3_ota]
extends = env:seeed_xiao_esp32s3
upload_protocol = espota
; host_port ustalony na stałe (zamiast domyślnego losowego 10000-60000) —
; komp i ESP32 są w różnych podsieciach (Mikrotik, VLAN IoT z izolacją),
; więc zwrotne połączenie TCP od ESP32 wymaga tymczasowej reguły firewalla
; na Mikrotiku; stały port pozwala tę regułę zawęzić do jednego portu.
upload_flags =
    --auth=${sysenv.OTA_PASSWORD_192_168_10_4}
    --host_port=8266
; Bez upload_port — mDNS auto-discovery. Jeśli zawiedzie, odkomentuj:
; upload_port = 192.168.x.x
